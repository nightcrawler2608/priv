services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scraper
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper -d scraper"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://scraper:scraper@postgres:5432/scraper
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      # SENTRY_DSN, ALERT_WEBHOOK_URL: opt-in, set in a .env file or here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - scraper_data:/app/data

  worker:
    build: .
    command: celery -A api.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://scraper:scraper@postgres:5432/scraper
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - scraper_data:/app/data

  beat:
    build: .
    command: celery -A api.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg2://scraper:scraper@postgres:5432/scraper
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - scraper_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
  scraper_data:
